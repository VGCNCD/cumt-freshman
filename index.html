 <!DOCTYPE html>
 <html lang="zh-CN">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>矿洞 · 中国矿业大学新生指南</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
 <style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;color:#1a1a2e;overflow:hidden;height:100vh;width:100vw;-webkit-font-smoothing:antialiased}
 :root{--primary:#004098;--primary-light:#e8eef8;--accent:#e8a838;--accent-light:#fef6e8;--bg:#f5f6fa;--card:#fff;--text:#1a1a2e;--dim:#6b7280;--border:#e5e7eb;--shadow:0 4px 24px rgba(0,0,0,.06);--shadow-lg:0 8px 40px rgba(0,0,0,.08);--radius:16px}
 
 /* ===== Login ===== */
 #loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#f5f6fa;overflow-y:auto;padding:24px}
 .login-container{width:420px;max-width:100%;padding:52px 40px;text-align:center;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;animation:fadeIn .5s ease}
 .login-container::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary))}
 @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
 @keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
 @keyframes slideRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
 .login-icon{width:72px;height:72px;margin:0 auto 20px;background:linear-gradient(135deg,var(--primary),#1a5cb5);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 8px 24px rgba(0,64,152,.25)}
 .login-badge{display:inline-block;padding:4px 14px;border-radius:50px;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:600;letter-spacing:2px;margin-bottom:12px}
 .login-title{font-size:26px;font-weight:900;color:var(--text);margin-bottom:4px;letter-spacing:3px}
 .login-sub{font-size:14px;color:var(--dim);margin-bottom:32px}
 .login-input{width:100%;padding:16px 20px;border:2px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font-size:18px;letter-spacing:5px;text-align:center;outline:none;transition:all .3s;font-family:monospace;font-weight:600}
 .login-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,64,152,.1);background:#fff}
 .login-input::placeholder{color:#b0b0c0;letter-spacing:2px;font-size:14px;font-weight:400}
 .login-btn{width:100%;margin-top:18px;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),#1a5cb5);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:2px}
 .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,64,152,.3)}
 .login-btn:active{transform:translateY(0)}
 .login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
 .login-error{color:#dc2626;font-size:13px;margin-top:12px;min-height:22px;opacity:0;transition:all .3s;font-weight:500}
 .login-error.show{opacity:1}
 .login-error.success{color:#059669}
 .login-getcode{margin-top:24px;font-size:13px;color:var(--dim)}
 .login-getcode a{color:var(--primary);cursor:pointer;text-decoration:none;font-weight:600}
 .login-getcode a:hover{text-decoration:underline}
 .login-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:#9ca3af;line-height:1.8}
 
 /* ===== Main Screen ===== */
 #mainScreen{position:fixed;inset:0;display:none;background:#f5f6fa;overflow:hidden}
 .main-header{position:fixed;top:0;left:0;right:0;z-index:20;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);animation:slideDown .4s ease}
 .main-header-left{display:flex;align-items:center;gap:12px}
 .main-header-icon{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
 .main-header h1{font-size:17px;font-weight:800;color:var(--text);letter-spacing:1px}
 .main-header .sub{font-size:11px;color:var(--dim);margin-top:1px}
 .main-header-right{display:flex;align-items:center;gap:12px}
 .header-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500}
 .header-btn:hover{background:var(--bg);color:var(--text);border-color:#c0c0d0}
 .header-btn.danger:hover{background:#fef2f2;color:#dc2626;border-color:#fecaca}
 
 /* ===== Radial Menu ===== */
 .radial-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
 .radial-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#1a5cb5);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2;color:#fff;box-shadow:0 4px 16px rgba(0,64,152,.25);cursor:default;animation:scaleIn .3s ease}
 @keyframes scaleIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
 @keyframes nodeAppear{0%{transform:translate(-50%,-50%) rotate(-180deg) scale(0);opacity:0}70%{transform:translate(-50%,-50%) rotate(15deg) scale(1.1)}100%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:1}}
 .radial-node{position:absolute;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);background:#fff;border:1.5px solid var(--border);box-shadow:var(--shadow);z-index:3;opacity:0;animation:nodeAppear .5s cubic-bezier(.34,1.56,.64,1) forwards}
 .radial-node:hover{border-color:var(--primary)!important;box-shadow:0 8px 30px rgba(0,64,152,.12)!important;z-index:10}
 .radial-node .icon{font-size:22px;margin-bottom:3px;line-height:1}
 .radial-node .label{font-size:10px;color:var(--dim);white-space:nowrap;font-weight:500;letter-spacing:.5px}
 
 /* Background circles */
 .bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
 .bg-layer .c{position:absolute;border-radius:50%;opacity:.03}
 .bg-layer .c1{width:500px;height:500px;background:var(--primary);top:-100px;right:-100px;animation:float1 20s ease-in-out infinite}
 .bg-layer .c2{width:350px;height:350px;background:var(--accent);bottom:-80px;left:-80px;animation:float2 25s ease-in-out infinite}
 .bg-layer .c3{width:200px;height:200px;background:var(--primary);top:50%;left:30%;animation:float3 30s ease-in-out infinite}
 @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
 @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}
 @keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,40px)}}
 
 /* ===== Content Panel ===== */
 #contentPanel{position:fixed;inset:0;z-index:50;display:none;background:#fff;overflow-y:auto;animation:slideRight .35s ease}
 .content-header{position:sticky;top:0;z-index:10;padding:16px 28px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
 .content-back{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
 .content-back:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
 .content-header h2{font-size:17px;font-weight:700;color:var(--text)}
 .content-body{padding:36px 28px 80px;max-width:720px;margin:0 auto;animation:fadeIn .4s ease .1s both}
 .content-body h3{font-size:18px;font-weight:700;color:var(--primary);margin-top:32px;margin-bottom:10px;padding-left:14px;border-left:3px solid var(--accent)}
 .content-body h3:first-child{margin-top:0}
 .content-body p{font-size:15px;line-height:2;color:#374151;margin-bottom:14px}
 .content-body ul{padding-left:4px;margin-bottom:16px}
 .content-body ul li{font-size:14.5px;line-height:1.9;color:#374151;margin-bottom:7px;list-style:none;position:relative;padding-left:20px}
 .content-body ul li::before{content:'';position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
 .content-body .highlight{background:var(--primary-light);border-left:4px solid var(--primary);padding:16px 20px;border-radius:0 12px 12px 0;margin:18px 0;font-size:14.5px;color:#1e3a5f;line-height:1.8}
 .content-body .highlight strong{color:var(--primary)}
 .content-body a{color:var(--primary);text-decoration:none;font-weight:600}
 .content-body a:hover{text-decoration:underline}
 .content-credit{margin-top:40px;padding:20px;text-align:center;border-top:1px solid var(--border);font-size:12px;color:#9ca3af;line-height:2}
 
 /* ===== Toast ===== */
 .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .4s;z-index:200;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.15)}
 .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
 
 /* ===== Responsive ===== */
 @media(max-width:640px){
 .login-container{padding:40px 24px;border-radius:20px}
 .login-title{font-size:22px}
 .login-input{font-size:16px;padding:14px 16px}
 .radial-node{width:62px;height:62px}
 .radial-node .icon{font-size:18px}
 .radial-node .label{font-size:9px}
 .main-header{padding:14px 16px}
 .content-body{padding:24px 16px 60px}
 .content-header{padding:12px 16px}
 .main-header h1{font-size:15px}
 }
 </style>
 </head>
 <body>
 
 <div id="loginScreen">
   <div class="login-container">
     <div class="login-icon">&#9874;</div>
     <div class="login-badge">CUMT 2026</div>
     <div class="login-title">矿洞新生指南</div>
     <div class="login-sub">中国矿业大学 · 输入邀请码开启你的矿大之旅</div>
     <input class="login-input" id="codeInput" type="text" placeholder="CUMT-XXXXXX" maxlength="11" autocomplete="off" spellcheck="false">
     <button class="login-btn" id="loginBtn" onclick="verifyCode()">进入矿洞</button>
     <div class="login-error" id="loginError">邀请码无效，请检查后重试</div>
     <div class="login-getcode">还没有邀请码？<a href="#" onclick="showHowToGet();return false">加入新生群领取 →</a></div>
     <div class="login-footer">欧阳深团队 —— VGCNCD 创作<br>为中国矿业大学新生 · 用心打造</div>
   </div>
 </div>
 
 <div class="toast" id="toast"></div>
 
 <div id="mainScreen">
   <div class="bg-layer"><div class="c c1"></div><div class="c c2"></div><div class="c c3"></div></div>
   <header class="main-header">
     <div class="main-header-left">
       <div class="main-header-icon">&#9874;</div>
       <div>
         <h1>矿洞</h1>
         <div class="sub">中国矿业大学新生指南</div>
       </div>
     </div>
     <div class="main-header-right">
       <button class="header-btn" onclick="showCredit()">关于</button>
       <button class="header-btn danger" onclick="logout()">退出</button>
     </div>
   </header>
   <div class="radial-wrap" id="radialContainer"></div>
 </div>
 
 <div id="contentPanel">
   <div class="content-header">
     <button class="content-back" onclick="closeContent()">&#8592;</button>
     <h2 id="contentTitle"></h2>
   </div>
   <div class="content-body" id="contentBody"></div>
 </div>
 
 <script>
 const SECTIONS = [
   {id:"history",icon:"\u{1F3DB}",title:"百年矿大",content:`
 <h3>百年校史</h3>
 <p>中国矿业大学始建于1909年，前身为焦作路矿学堂，是近代中国创办最早、延续至今的矿业高等学府之一。学校历经十四次搬迁、十二次易名，始终薪火相传，被誉为"煤炭行业的人才摇篮"。</p>
 <h3>办学层次</h3>
 <p>教育部直属全国重点大学，国家"211工程"和"985工程优势学科创新平台"建设高校，2017年入选国家"双一流"建设高校。以工科为主，理工文管法经等多学科协调发展，矿业工程、安全科学与工程等领域处于国内顶尖水平。</p>
 <h3>校训精神</h3>
 <div class="highlight"><strong>崇德 · 尚学 · 求是 · 创新</strong><br>这四个词凝聚了矿大人的精神追求：崇尚道德、重视学问、追求真理、勇于创新。</div>
 <h3>校区格局</h3>
 <p><strong>南湖校区</strong>（主校区）：位于徐州铜山区大学路1号，占地约2800亩，现代化园林式校园，大部分本科生、研究生在此就读。<br><br><strong>文昌校区</strong>（老校区）：位于徐州泉山区，矿大精神发源地，环境清幽，承载着百年矿大的历史记忆。</p>
 `},
   {id:"campus",icon:"\u{1F3E0}",title:"校园概况",content:`
 <h3>南湖校区</h3>
 <p>南湖校区坐落在徐州南郊云龙湖畔，校园环境优美，绿化覆盖率高。标志性建筑包括南湖图书馆（造型现代，是学校的文化地标）、行政楼、各学院楼群等。校园内有镜湖、不显山等自然景观，四季景色各异。</p>
 <h3>主要建筑</h3>
 <ul>
   <li><strong>南湖图书馆</strong>：建筑面积约6万平方米，藏书丰富，设有自习区、电子阅览区、学术报告厅等</li>
   <li><strong>博学楼 / 博雅楼</strong>：主要教学楼，大部分课程在此进行</li>
   <li><strong>体育馆</strong>：含游泳馆、篮球馆、羽毛球馆等</li>
   <li><strong>大学生活动中心</strong>：社团活动、文艺演出的主要场所</li>
 </ul>
 <h3>校园亮点</h3>
 <p>矿大校园是徐州最美的校园之一，春天樱花烂漫、夏天镜湖荷花、秋天银杏金黄、冬天雪景如画。校园内还有黑天鹅、锦鲤等，为校园增添生机。校内交通便利，有共享电动车和校园公交，还有校际班车往来南湖和文昌校区。</p>
 `},
   {id:"dorm",icon:"\u{1F6CF}",title:"宿舍指南",content:`
 <h3>宿舍条件</h3>
 <p>南湖校区本科生宿舍主要为<strong>4人间</strong>，标配<strong>上床下桌</strong>，配备空调和暖气。大部分宿舍楼有独立卫浴。每栋楼都配备热水房和公共洗衣房。</p>
 <h3>住宿须知</h3>
 <ul>
   <li>床铺尺寸：约 2.0m × 0.9m，建议自备或到校购买床品</li>
   <li>宿舍楼有门禁系统，凭校园卡进出，晚上按时关门</li>
   <li>宿舍内禁止使用大功率电器（电热毯、电饭煲等）</li>
   <li>校园网接入每个床位，需办理校园网套餐</li>
 </ul>
 <h3>宿舍神器推荐</h3>
 <p>床边挂篮、台灯/酷毙灯、插排（带USB口）、收纳盒、遮光床帘、耳塞眼罩</p>
 <div class="highlight">报到当天可以先到宿舍放行李再去办其他手续，建议携带有轮子的行李箱。</div>
 `},
   {id:"food",icon:"\u{1F372}",title:"食堂美食",content:`
 <h3>食堂一览</h3>
 <p>南湖校区有多个食堂，各具特色，且价格实惠，月均伙食费约800-1200元。</p>
 <ul>
   <li><strong>一食堂</strong>：靠近教学区，早餐丰富，牛肉面、煎饼果子不容错过</li>
   <li><strong>二食堂</strong>：品种最多，自选餐窗口性价比极高，推荐重庆小面、黄焖鸡</li>
   <li><strong>三食堂（音乐餐厅）</strong>：装修最时尚，可边听音乐边吃饭，麻辣香锅是招牌</li>
   <li><strong>教职工餐厅</strong>：晚餐和周末对学生开放，环境安静</li>
 </ul>
 <div class="highlight">强烈推荐：三食堂的麻辣香锅、一食堂的牛肉板面、二食堂一楼的自选早餐！</div>
 `},
   {id:"study",icon:"\u{1F4DA}",title:"学习攻略",content:`
 <h3>图书馆使用指南</h3>
 <p>南湖图书馆开馆时间通常为7:00-22:00。馆内设有：普通自习区、静音自习区、电子阅览区、研讨间（需预约）。考试周期间座位紧张，建议早起占位。</p>
 <h3>选课须知</h3>
 <p>每学期分为通识选修课和专业必修/选修课。建议提前了解培养方案做好四年规划，咨询学长学姐推荐课程，大一建议选20-24学分。</p>
 <h3>校园网</h3>
 <p>校园网覆盖教学区和宿舍区。每月有免费流量额度，超出需充值。学校提供VPN方便校外访问图书馆电子资源。</p>
 <h3>奖学金与竞赛</h3>
 <p>矿大设有国家奖学金、国家励志奖学金、校奖学金等。还有"挑战杯"、大创、数学建模等各类竞赛，积极参加对综合素质和保研都有帮助。</p>
 `},
   {id:"register",icon:"\u{1F4CB}",title:"报到流程",content:`
 <h3>时间安排</h3>
 <p>新生开学报到通常在<strong>9月初</strong>（具体以录取通知书为准）。宿舍一般提前1-2天开放入住，建议提前到校熟悉环境。</p>
 <h3>必备材料</h3>
 <ul>
   <li>录取通知书原件</li>
   <li>身份证及复印件（多备几份）</li>
   <li>一寸／二寸证件照（红白蓝底各5-8张）</li>
   <li>高考准考证</li>
   <li>个人学籍档案（部分省份需自带）</li>
   <li>团员证及党团组织关系材料</li>
   <li>户口迁移证（如需迁户口）</li>
 </ul>
 <h3>报到流程</h3>
 <p>到校 → 找到学院迎新点 → 核验身份 → 领取校园卡/宿舍钥匙 → 前往宿舍 → 办理入住</p>
 <div class="highlight">报到当天，学校在徐州站、徐州东站设有迎新点，有学长学姐举牌接站，跟着"中国矿业大学"指示牌走就好。</div>
 `},
   {id:"military",icon:"\u{1F396}",title:"军训须知",content:`
 <h3>军训安排</h3>
 <p>新生入学报到后通常进行<strong>2-3周</strong>的军训。训练内容包括队列训练、军体拳、射击训练（模拟枪）、拉歌、内务整理等。</p>
 <h3>必备物品</h3>
 <ul>
   <li><strong>防晒霜</strong>：徐州9月阳光强烈，SPF50+必备</li>
   <li><strong>大水杯</strong>：建议1.5L以上，补水很重要</li>
   <li><strong>舒适的运动鞋</strong>：军训发的鞋偏硬，可自备软鞋垫</li>
   <li><strong>应急药品</strong>：创可贴、藿香正气水等</li>
 </ul>
 <h3>军训建议</h3>

 // ===== Invitation Codes =====
 const CODE_SEED = 20260721;
 const TOTAL_CODES = 50000;
 const USED_CODES_KEY = "cumt_used_codes_v3";
 function seededRandom(s){let seed=s;return function(){seed=(seed*1664525+1013904223)&0x7FFFFFFF;return seed/0x7FFFFFFF}}
 function genCode(i){const r=seededRandom(CODE_SEED+i*9973),c="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";let s="CUMT-";for(let j=0;j<6;j++)s+=c[Math.floor(r()*c.length)];return s}
 const CODES=new Set(Array.from({length:TOTAL_CODES},(_,i)=>genCode(i)));
 function getUsedCodes(){try{return new Set(JSON.parse(localStorage.getItem(USED_CODES_KEY)||"[]"))}catch{return new Set()}}
 function markUsed(c){const u=getUsedCodes();u.add(c);localStorage.setItem(USED_CODES_KEY,JSON.stringify([...u]))}
 function isUsed(c){return getUsedCodes().has(c)}
 
 function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
 
 function verifyCode(){
   const i=document.getElementById("codeInput"),e=document.getElementById("loginError"),b=document.getElementById("loginBtn"),c=i.value.trim().toUpperCase();
   e.classList.remove("show","success");
   if(!c){e.textContent="请输入邀请码";e.classList.add("show");return}
   if(!/^CUMT-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$/.test(c)){e.textContent="格式：CUMT-XXXXXX（6位大写字母数字）";e.classList.add("show");return}
   b.disabled=true;b.textContent="验证中...";
   setTimeout(()=>{
     if(!CODES.has(c)){e.textContent="邀请码无效";e.classList.add("show");b.disabled=false;b.textContent="进入矿洞";return}
     if(isUsed(c)){e.textContent="该邀请码已被使用";e.classList.add("show");b.disabled=false;b.textContent="进入矿洞";return}
     markUsed(c);enterMain();
   },500);
 }
 
 function showHowToGet(){const e=document.getElementById("loginError");e.style.color="#059669";e.textContent="加入新生群领取邀请码，群号：123456789";e.classList.add("show")}
 
 function enterMain(){
   document.getElementById("loginScreen").style.display="none";
   document.getElementById("mainScreen").style.display="block";
   initRadial();
 }
 
 function logout(){
   ["mainScreen","contentPanel"].forEach(id=>document.getElementById(id).style.display="none");
   document.getElementById("loginScreen").style.display="flex";
   document.getElementById("codeInput").value="";
   document.getElementById("loginBtn").disabled=false;
   document.getElementById("loginBtn").textContent="进入矿洞";
   radialDone=false;document.getElementById("radialContainer").innerHTML="";
 }
 
 function showCredit(){showToast("欧阳深团队 —— VGCNCD 创作 · 为中国矿业大学新生用心打造")}
 
 // ===== Radial Menu with Spin Animation =====
 let radialDone=false;
 function initRadial(){
   if(radialDone)return;radialDone=true;
   const wrap=document.getElementById("radialContainer"),n=SECTIONS.length;
   const radius=Math.min(window.innerWidth,window.innerHeight)*0.30,nodeSize=Math.min(76,window.innerWidth*0.12);
 
   // Center dot
   const ctr=document.createElement("div");ctr.className="radial-center";ctr.textContent="\u{1F50D}";wrap.appendChild(ctr);
 
   // Create nodes at center first, then animate outward with spin
   SECTIONS.forEach((sec,i)=>{
     const a=(i/n)*2*Math.PI-Math.PI/2;
     const fx=Math.cos(a)*radius,fy=Math.sin(a)*radius;
     const nd=document.createElement("div");nd.className="radial-node";
     nd.innerHTML=`<div class="icon">${sec.icon}</div><div class="label">${sec.title}</div>`;
     nd.style.cssText=`width:${nodeSize}px;height:${nodeSize}px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(0deg) scale(0);opacity:0;transition:all 0s`;
     nd.onclick=()=>openContent(i);
     wrap.appendChild(nd);
 
     // Staggered animation: expand from center with rotation
     requestAnimationFrame(()=>{
       requestAnimationFrame(()=>{
         const rot=-180+360*(i/n);
         nd.style.cssText=`width:${nodeSize}px;height:${nodeSize}px;left:50%;top:50%;opacity:1;
           transform:translate(${-nodeSize/2}px,${-nodeSize/2}px) translate(${fx}px,${fy}px) rotate(${rot}deg);
           transition:all 0.55s cubic-bezier(.34,1.56,.64,1) ${i*0.06}s`;
       });
     });
   });
 
   // After expansion, remove the rotation but keep position
   setTimeout(()=>{
     document.querySelectorAll(".radial-node").forEach((nd,i)=>{
       const a=(i/n)*2*Math.PI-Math.PI/2;
       const fx=Math.cos(a)*radius,fy=Math.sin(a)*radius;
       nd.style.transition=`all 0.4s cubic-bezier(.4,0,.2,1) 0s`;
       nd.style.transform=`translate(${-nodeSize/2}px,${-nodeSize/2}px) translate(${fx}px,${fy}px) rotate(0deg)`;
     });
   }, 550+SECTIONS.length*60+200);
 }
 
 // ===== Content =====
 function openContent(i){const s=SECTIONS[i];document.getElementById("contentTitle").textContent=s.icon+"  "+s.title;document.getElementById("contentBody").innerHTML=s.content;document.getElementById("contentPanel").style.display="block";document.getElementById("contentPanel").scrollTop=0}
 function closeContent(){document.getElementById("contentPanel").style.display="none"}
 
 document.getElementById("codeInput").addEventListener("keydown",function(e){if(e.key==="Enter")verifyCode()});
 
 window.addEventListener("resize",()=>{if(document.getElementById("mainScreen").style.display==="block"){radialDone=false;document.getElementById("radialContainer").innerHTML="";initRadial()}});
 
 // ===== Background particles =====
 (function(){
   const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4";
   document.getElementById("mainScreen").prepend(c);
   const ctx=c.getContext("2d");let w=c.width=window.innerWidth,h=c.height=window.innerHeight;
   const pts=Array.from({length:35},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*2+1}));
   function draw(){
     ctx.clearRect(0,0,w,h);
     pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
       ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(0,64,152,"+(.06+Math.random()*.08)+")";ctx.fill()});
     requestAnimationFrame(draw);
   }
   draw();
   window.addEventListener("resize",()=>{w=c.width=window.innerWidth;h=c.height=window.innerHeight});
 })();
 </script>
