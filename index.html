<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(170deg,#E8EEF8,#F5F6FA,#F0F4FA);color:#1a1a2e;overflow:hidden;height:100vh;width:100vw;-webkit-font-smoothing:antialiased}
:root{--primary:#004098;--primary-light:#e8eef8;--accent:#e8a838;--accent-light:#fef6e8;--bg:#f5f6fa;--card:#fff;--text:#1a1a2e;--dim:#6b7280;--border:#e5e7eb;--shadow:0 4px 24px rgba(0,0,0,.06);--shadow-lg:0 8px 40px rgba(0,0,0,.08)}
#loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px} #loginScreen::before{content:'';position:absolute;inset:0;background:url(bg.png) center/cover no-repeat;opacity:.10;z-index:0;background-position:center 30%}
.login-container{width:420px;max-width:100%;padding:52px 40px;text-align:center;background:#fff;border-radius:24px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;animation:fadeIn .5s ease}
.login-container::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary))}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeNode{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.login-icon{width:72px;height:72px;margin:0 auto 20px;background:linear-gradient(135deg,var(--primary),#1a5cb5);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 8px 24px rgba(0,64,152,.25)}
.login-badge{display:inline-block;padding:4px 14px;border-radius:50px;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:600;letter-spacing:2px;margin-bottom:12px}
.login-title{font-size:26px;font-weight:900;color:var(--text);margin-bottom:4px;letter-spacing:3px}
.login-sub{font-size:14px;color:var(--dim);margin-bottom:28px}
.login-btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),#1a5cb5);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:2px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,64,152,.3)}
.login-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:#9ca3af;line-height:1.8}
#mainScreen{position:fixed;inset:0;display:none;overflow:hidden} #mainScreen::before{content:'';position:absolute;inset:0;background:url(bg.png) center/cover no-repeat;opacity:.15;z-index:0;background-position:center 30%}
.main-header{position:fixed;top:0;left:0;right:0;z-index:20;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);animation:slideDown .4s ease}
.main-header-left{display:flex;align-items:center;gap:12px}
.main-header-icon{width:36px;height:36px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}

.main-header .sub{font-size:11px;color:var(--dim);margin-top:1px}
.header-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;cursor:pointer;transition:all .2s;font-weight:500}
.header-btn:hover{background:var(--bg);color:var(--text);border-color:#c0c0d0}
.radial-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.radial-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#1a5cb5);display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2;color:#fff;box-shadow:0 4px 16px rgba(0,64,152,.25);cursor:pointer;animation:scaleIn .3s ease}
.radial-node{position:absolute;width:92px;height:92px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);background:#fff;border:1.5px solid var(--border);box-shadow:var(--shadow);z-index:3;opacity:0}
.radial-node:hover{border-color:var(--primary)!important;box-shadow:0 8px 30px rgba(0,64,152,.12)!important;z-index:10}

.radial-node .label{font-size:10px;color:var(--dim);white-space:nowrap;font-weight:500;letter-spacing:.5px}
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-layer .c{position:absolute;border-radius:50%;opacity:.03}
.bg-layer .c1{width:500px;height:500px;background:var(--primary);top:-100px;right:-100px;animation:float1 20s ease-in-out infinite}
.bg-layer .c2{width:350px;height:350px;background:var(--accent);bottom:-80px;left:-80px;animation:float2 25s ease-in-out infinite}
.bg-layer .c3{width:200px;height:200px;background:var(--primary);top:50%;left:30%;animation:float3 30s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-20px)}}

#contentPanel{position:fixed;inset:0;z-index:50;display:none;background:#fff;overflow-y:auto;animation:slideRight .35s ease}

.content-body{padding:36px 28px 80px;max-width:760px;margin:0 auto;animation:fadeIn .4s ease .1s both}
.content-body h3{font-size:18px;font-weight:700;color:var(--primary);margin-top:32px;margin-bottom:10px;padding-left:14px;border-left:3px solid var(--accent)}
.content-body h3:first-child{margin-top:0}
.content-body p{font-size:15px;line-height:2;color:#374151;margin-bottom:14px}
.content-body ul{padding-left:4px;margin-bottom:16px}
.content-body ul li{font-size:14.5px;line-height:1.9;color:#374151;margin-bottom:7px;list-style:none;position:relative;padding-left:20px}
.content-body ul li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.content-body .highlight{background:var(--primary-light);border-left:4px solid var(--primary);padding:16px 20px;border-radius:0 12px 12px 0;margin:18px 0;font-size:14.5px;color:#1e3a5f;line-height:1.8}
.content-body .highlight strong{color:var(--primary)}
.content-body a{color:var(--primary);text-decoration:none;font-weight:600}
.content-body a:hover{text-decoration:underline}
.content-credit{margin-top:40px;padding:20px;text-align:center;border-top:1px solid var(--border);font-size:12px;color:#9ca3af;line-height:2}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:all .4s;z-index:200;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.search-overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding-top:16vh;backdrop-filter:blur(2px)}
.search-overlay.show{display:flex;animation:fadeIn .2s ease}
.search-box{width:500px;max-width:92vw;background:#fff;border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.15);overflow:hidden}
.search-input-wrap{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);gap:10px}
.search-input-wrap input{flex:1;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--text);background:transparent}
.search-input-wrap input::placeholder{color:#b0b0c0}
.search-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);color:var(--dim);font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.search-close:hover{background:#e5e7eb}
.search-results{max-height:320px;overflow-y:auto}
.search-results .item{display:flex;align-items:center;gap:11px;padding:13px 20px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.search-results .item:hover{background:var(--primary-light)}
.search-results .ico{font-size:19px;flex-shrink:0}
.search-results .info{flex:1;min-width:0}
.search-results .t{font-size:13.5px;font-weight:600;color:var(--text)}
.search-results .d{font-size:12px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.search-empty{padding:28px 20px;text-align:center;color:var(--dim);font-size:13.5px}
@media(max-width:640px){.login-container{padding:40px 24px;border-radius:20px}.login-title{font-size:22px}.radial-node{width:72px;height:72px}.radial-node .icon{font-size:18px}.radial-node .label{font-size:9px}.main-header{padding:14px 16px}.content-body{padding:24px 16px 60px}.content-header{padding:12px 16px}.main-header h1{font-size:15px}}

<body>
<div id="loginScreen"><div class="login-container"><div class="login-icon">&#9874;</div><div class="login-badge">CUMT 2026</div><div class="login-title">矿神九考</div><div class="login-sub">中国矿业大学 · 为每一颗矿石照亮前路</div><button class="login-btn" onclick="enterMain()">进入矿神九考</button><div class="login-footer">欧阳深团队 —— VGCNCD 创作<br>为中国矿业大学新生 · 用心打造</div></div></div>
<div class="toast" id="toast"></div>
<div id="mainScreen"><div class="bg-layer"><div class="c c1"></div><div class="c c2"></div><div class="c c3"></div></div><header class="main-header"><div class="main-header-left"><div class="main-header-icon">&#9874;</div><div><h1>矿神九考</h1><div class="sub">中国矿业大学新生指南</div></div></div><div class="main-header-right"><button class="header-btn" onclick="showToast('欧阳深团队 —— VGCNCD 创作')">关于</button></div></header><div class="radial-wrap" id="radialContainer"></div></div>
<div class="search-overlay" id="searchOverlay" onclick="closeSearch(event)"><div class="search-box" onclick="event.stopPropagation()"><div class="search-input-wrap"><span style="font-size:17px;flex-shrink:0">&#128269;</span><input type="text" id="searchInput" placeholder="搜索关键词...（如：宿舍、食堂、军训、办卡）" oninput="doSearch()" onkeydown="if(event.key==='Escape')closeSearch()"><button class="search-close" onclick="closeSearch()">&#10005;</button></div><div class="search-results" id="searchResults"><div class="search-empty">输入关键词搜索</div></div></div></div>

<script>
const SECTIONS = [
  {id:"trial1",icon:"\u{1F392}",title:"试炼一\u00B7行囊备战",content:`<h3>试炼一：行囊拷问 —— 开学备战篇</h3><p>这一关是你入校前的最后检阅。出发之前把该带的东西带齐，报到当天才不会手忙脚乱。</p><h3>一、必带证件六件套</h3><ul><li><strong>录取通知书</strong>——原件务必随身带好，内附的入学须知里写着各专业官方QQ群号、报到时间地点、学费住宿费标准、宿舍床铺尺寸等关键信息。</li><li><strong>身份证 + 复印件</strong>——正反面多印几份，入学登记、银行开卡、宿舍入住都可能用到。</li><li><strong>高考准考证</strong>——万一录取通知书出了意外，这张纸就是你的Plan B。</li><li><strong>个人学籍档案袋</strong>——这条是重中之重：<strong>绝对不要拆封！</strong>一旦开封，重新审核流程非常折腾。</li><li><strong>团组织关系材料</strong>——团员证、入团志愿书等。团籍转接需登录"智慧团建"系统：登录 → 关系转接 → 选择"升学" → 搜索所在学院"2026级新生临时支部"。路径：团江苏省委 → 中国矿业大学团委 → XX学院团委 → 2026级新生临时支部。</li><li><strong>证件照片</strong>——1寸和2寸各备八张左右，红白蓝底都来一些。报社团、入党、交简历、申请助学等场合用量不小。</li></ul><h3>二、户口迁移（自愿）</h3><p>户口迁不迁全凭自愿。如果要迁，带录取通知书和户口本去户籍派出所办迁移证（有效期30天），开学后交给辅导员。不迁的话，带户口本复印件备用，需要时可去南湖警务站办居住证。</p><h3>三、学校发的银行卡</h3><p>录取通知书里附带一张中国银行卡，用于交学费、住宿费、教材费，也用来接收学校的奖助学金。开学前记得去银行激活。</p><h3>四、衣物与卧具</h3><ul><li><strong>衣物</strong>：九月徐州还算热，先带夏装和运动鞋。冬装可以后续从家里快递过来。</li><li><strong>卧具</strong>：矿大不统一发床上用品，提供预订服务——606元一套，含棉被、垫褥、被罩床单枕套各两套、蚊帐、枕芯。在迎新系统预订后报到时付款领取。床尺寸1.95×0.85米，身高特别高的可申请加长床。</li></ul><h3>五、电子产品</h3><ul><li><strong>手机 + 充电宝</strong>——军训期间充电宝是刚需。</li><li><strong>电脑</strong>——大一新生原则上不让带，建议国庆后再向辅导员申请。有需要可去机房或图书馆电子阅览室。</li><li><strong>U盘 + 耳机</strong>——拷课件、打印资料、图书馆自习室基本装备。</li></ul><h3>六、邮寄行李</h3><div class="highlight">南湖校区快递地址：<strong>江苏省徐州市铜山区大学路1号中国矿业大学南湖校区桃苑4号楼菜鸟驿站</strong></div>`},
  {id:"trial2",icon:"\u{1F5FA}",title:"试炼二\u00B7报到迷宫",content:`<h3>试炼二：迷宫突围 —— 报到与地图篇</h3><p>南湖校区很大，但用对了方法就不会迷路。本关帮你理清报到流程和校园布局。</p><h3>一、开学报到流程</h3><p>入学后第一周：<strong>新生入学体检 → 入学教育 → 激活账号 → 领校园卡 → 军训</strong>。每个环节都有志愿者指引。</p><p>三个大门：东门（正门，24小时）、南门（早7-晚10）、北门。报到建议从东门或南门进。</p><h3>二、来校交通</h3><ul><li><strong>徐州东站（高铁）</strong>：打车到南湖约25分钟，30元左右</li><li><strong>徐州站（普速）</strong>：打车约25分钟，20元左右</li><li><strong>观音机场</strong>：顺风车约30元，打车约50元。报到日有接驳大巴</li></ul><div class="highlight">报到当天徐州站和徐州东站有学校迎新大巴，车身印着"中国矿业大学"，志愿者出站口等你。跟着走就行。</div><h3>三、校园核心地图</h3><ul><li><strong>图书馆</strong>——正中心，地理和精神的双重地标</li><li><strong>图书馆以北</strong>——各学院办公楼</li><li><strong>图书馆以南</strong>——公教区（博学楼1-5号，上课主战场）</li><li><strong>体育馆</strong>——最北端</li><li><strong>三大食堂</strong>——分别靠近桃苑、松苑、杏苑</li></ul><h3>四、南湖校区地图</h3><div style="text-align:center;margin:16px 0"><img src="map.png" style="max-width:100%;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.06)" alt="南湖校区地图"></div><h3>五、报到路线视频指南</h3><div class="highlight"><strong>欧阳深学长录制的报到路线视频：</strong><br><br><a href="https://v.douyin.com/yO-jUsAbcfk/" target="_blank" style="display:inline-block;padding:10px 20px;background:var(--primary);color:#fff;border-radius:8px;text-decoration:none;font-weight:600">&#9654; 打开抖音查看报到指南视频</a><br><br><span style="font-size:12px;color:var(--dim)">链接：https://v.douyin.com/yO-jUsAbcfk/</span></div>`},
  {id:"trial3",icon:"\u{1F6E1}",title:"试炼三\u00B7生存考验",content:`<h3>试炼三：生存考验 —— 军训与防骗篇</h3><p>大学给你的第一道硬核考验——两周军训 + 随时可能遇到的套路。过了这关，才算真正的矿大人。</p><h3>一、军训全攻略</h3><p>为期两周。早上七点集合，练到十一点；下午三点到五点；晚上可能加训。最后一天上午阅兵汇报表演。</p><h3>二、军训保命清单</h3><ul><li><strong>防晒霜</strong>——SPF50+，出门前半小时涂，休息时补涂。不分男女，晒伤是真的疼。</li><li><strong>厚软鞋垫</strong>——军训鞋底薄，垫软鞋垫或卫生巾，站一天军姿脚才不废。</li><li><strong>超大容量水杯</strong>——1.5L起步</li><li><strong>藿香正气水/人丹</strong>——防中暑的救命药</li><li><strong>纸巾湿巾</strong>——消耗量远超你的想象</li></ul><h3>三、新生防骗指南</h3><ul><li>买贵重物品<strong>不要先交定金</strong>——防止商家以缺货为由强行换劣质产品。</li><li>遇到自称学长学姐的推销者，<strong>要求查看对方学生证</strong>验证身份。</li><li>开学期间有推销校园电话卡的，有需要可以办，但<strong>务必确认对方真实身份</strong>。</li><li>除录取通知书上的官方群以外，学校一般不会通过其他渠道主动联系新生。</li></ul>`},
  {id:"trial4",icon:"\u{1F3E0}",title:"试炼四\u00B7宿舍生活",content:`<h3>试炼四：安居之术 —— 宿舍生活篇</h3><p>矿大的宿舍条件在全国高校里排得上号。了解规则，这四年会住得很舒服。</p><h3>一、宿舍配置</h3><p>南湖所有本科生宿舍标准统一：<strong>空调、热水器、暖气、电风扇、阳台、独立卫浴、电子门禁</strong>。两室一厅套房设计——一个大套间里两间房，每间住4人，共用两个卫生间、一间浴室、三个洗手台。今年新换了空调。</p><p>六苑：<strong>梅兰竹松桃杏</strong>。女生集中住竹苑；桃苑位置最便利。不论分到哪个苑，都是<strong>上床下桌</strong>。每栋楼有24小时通宵自习室。</p><h3>二、水电与洗浴</h3><ul><li><strong>洗浴</strong>——宿舍内完成，热水器插校园卡。热水：6:30-8:30、11:00-14:00、17:00-24:00。冷水24小时。</li><li><strong>取电</strong>——门口白盒插校园卡通电，拔卡几分钟断电。电费约0.5元/度，每学期每人送40度。</li><li><strong>直饮水</strong>——每宿舍一台饮水机，冷热水即取即饮。</li></ul><h3>三、门禁与断网</h3><p>大门6:00-23:00开放，23:00后只进不出。周日到周四23:30断网，次日8:00恢复，周五周六节假日不断。</p><h3>四、宿舍神器</h3><p>床沿挂篮、遮光床帘、酷毙灯、带USB插排、桌面收纳盒——五样东西让生活质量提升一档。</p>`},
  {id:"trial5",icon:"\u{1F372}",title:"试炼五\u00B7干饭之魂",content:`<h3>试炼五：干饭之魂 —— 校园美食篇</h3><p>矿大南湖吃饭这件事安排得明明白白。</p><h3>一、校内三大食堂</h3><ul><li><strong>桃苑食堂（一食堂）</strong>——靠近图书馆，早餐牛肉板面、煎饼果子值得一试。</li><li><strong>松苑食堂（二食堂）</strong>——品类最全，自选窗口一荤两素十元出头。</li><li><strong>杏苑食堂（三食堂/音乐餐厅）</strong>——装修最顶，麻辣香锅是镇店之宝。</li></ul><p>支持校园卡、刷脸、微信支付宝。校内还有1818美食街区、C吧A吧（轻食休闲）。</p><h3>二、超市与外卖</h3><p>最大超市在桃苑食堂楼下。各宿舍区有小超市，ABC三超市分布在图书馆、博学一和博学四附近。外卖正常点没问题，注意23:00门禁。</p><div class="highlight"><strong>学长学姐口碑推荐</strong>：三食堂麻辣香锅、一食堂牛肉板面、二食堂黄焖鸡——这三样按头安利。</div>`},
  {id:"trial6",icon:"\u{1F4DA}",title:"试炼六\u00B7学海无涯",content:`<h3>试炼六：学海无涯 —— 学业与学习篇</h3><h3>一、图书馆通关指南</h3><p>南湖图书馆约6万平方米，阅览座位6200多席，纸质藏书241万册，电子图书441万种。法定节假日不闭馆。图书阅览室8:00-21:50（周末9:00起），周三下午闭馆。本科生可借10本，期限30天。三楼多媒体阅览室免费电脑，五楼知学空间有Mac、iPad、Kindle。</p><h3>二、晚自习</h3><p>大一有强制晚自习，周日到周四。学委需提前去教室占位。博学四楼五楼的四层五层是考研党的地盘，尽量别占。每栋宿舍楼有通宵自习室。</p><h3>三、入学分级考试</h3><ul><li><strong>英语分级</strong>——分1-3级，影响大一分班。需自备四六级听力耳机。</li><li><strong>计算机免修</strong>——上机测试，成绩优秀可免修《计算思维与人工智能基础实验》。</li></ul><h3>四、选课与考试</h3><p>专业主干课学校自动安排。通识选修需抢，建议优先选网络课程。无故缺考记0分标注"旷考"。作弊直接0分记处分——这个底线别碰。</p><h3>五、教材省钱攻略</h3><p>找直系学长学姐买二手教材，约5元一本，在跳蚤市场群吆喝一句就能收到。</p><h3>六、转专业与学业预警</h3><p>矿大转专业政策全国算宽松，专业间不设报名门槛。有意向的大一务必学好高数。旷课累计20学时受处分。学业预警分初、降、退三级。</p>`},
  {id:"trial7",icon:"\u{1F4F1}",title:"试炼七\u00B7极客网络",content:`<h3>试炼七：极客网络 —— 数字校园篇</h3><h3>一、校园无线网</h3><p>办理校园手机卡套餐后宽带和WiFi都包含在内。全校覆盖，宿舍接网线比WiFi更稳——抢课时候有线网明显快。断网：周日到周四23:30，次日8:00恢复。周五周六节假日通宵不断。</p><h3>二、校园电话卡</h3><div class="highlight"><strong>为什么建议线上提前办？</strong><br><br>报到当天先去校医院排队体检（6000多人平均等4小时），然后跑注册、领卡、搬行李……时间紧任务重。校园卡能提前线上搞定就提前搞，把精力留给真正重要的事。宽带绑定手机套餐，绝大多数同学都会办。加群了解和办理：<br><br><strong>矿神之群QQ版：1077143585</strong></div><h3>三、融合门户与教务</h3><ul><li><strong>融合门户</strong>：portal.cumt.edu.cn，账号学号，自行设密码</li><li><strong>教务系统</strong>：jwb.cumt.edu.cn，挂VPN后登录，默认密码身份证后六位</li><li><strong>VPN</strong>：newvpn.cumt.edu.cn，校外访问校内资源必备</li><li><strong>矿小助App</strong>：可导入课表，查电费余额</li></ul>`},
  {id:"trial8",icon:"\u{1F38A}",title:"试炼八\u00B7百团大作战",content:`<h3>试炼八：百团大作战 —— 社团与社交篇</h3><h3>一、社团招新与"扫楼"</h3><p>开学后社团陆续招新——发传单和"扫楼"（学长学姐进宿舍楼逐个敲门）。学长不进女生寝室，学姐会进男生寝室。之后"百团大战"全校社团集中摆摊，挑一个报名（热门可能要面试）。</p><h3>二、四大学生组织</h3><ul><li><strong>学生会</strong>——院级和校级，事务多但志愿时长丰富</li><li><strong>校科协</strong>——聚焦科技创新和学术竞赛</li><li><strong>校青协</strong>——公益组织，攒志愿时长主渠道</li><li><strong>社联</strong>——统筹管理全校社团</li></ul><h3>三、班干部与活动</h3><p>班长、团支书、学委等开学初竞选，对综合测评加分和简历有加分。校园活动：体育大会、校园马拉松（矿马）、田径运动会、元旦长跑、行健杯球赛、文化节、十佳歌手等。</p><h3>四、志愿时长</h3><p>评奖学金每年需要满20小时志愿时长。做多久记多久，学长学姐一般给得比较大方。社团活动、学院志愿者群发布的项目都是获取渠道。</p>`},
  {id:"trial9",icon:"\u{1F3D9}",title:"试炼九\u00B7出师下山",content:`<h3>试炼九：出师下山 —— 徐州游玩篇</h3><h3>一、周边热门商圈</h3><ul><li><strong>壹方城</strong>——最近的大商场，聚餐逛街首选</li><li><strong>铜山万达</strong>——骑车或打车可达，吃喝玩乐一站搞定</li><li><strong>三胞广场</strong>——坐校车到文昌后步行几百米即到</li><li><strong>苏宁广场（市中心）</strong>——63路公交直达，附近有1818夜市和富国街夜市</li></ul><h3>二、徐州美食必吃榜</h3><p>地锅鸡、把子肉、蒜爆鱼、羊方藏鱼、烙馍卷馓子、徐州米线、油烫鸭、徐州烧烤……单子列不完，来了慢慢吃。</p><h3>三、校内出行</h3><p>哈啰共享单车/电动车覆盖校园。校园小公交（小白车）固定线路招手即停，校园卡1.1元一次，运营7:30-20:00。路线：三食堂→二食堂→图书馆→计算机学院→文科楼→建筑与设计学院→博物馆→力土学院→矿业科学中心→环测学院→化工学院→行政楼。</p><h3>四、假期出行</h3><p>提前在12306完成学生优惠资质核验。徐州东站高铁1-2小时到南京、济南、郑州，3-4小时到北京、上海。</p>`},

function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2500)}

function enterMain(){document.getElementById("loginScreen").style.display="none";document.getElementById("mainScreen").style.display="block";initRadial()}

let radialDone=false;
function initRadial(){if(radialDone)return;radialDone=true;
  const wrap=document.getElementById("radialContainer"),n=SECTIONS.length;
  const r=Math.min(window.innerWidth,window.innerHeight)*0.33,s=Math.min(92,window.innerWidth*0.14);
  const ctr=document.createElement("div");ctr.className="radial-center";ctr.textContent="\u{1F50D}";ctr.title="点击搜索";ctr.onclick=openSearch;wrap.appendChild(ctr);
  SECTIONS.forEach(function(sec,i){
    const a=(i/n)*2*Math.PI-Math.PI/2,fx=Math.cos(a)*r,fy=Math.sin(a)*r;
    const nd=document.createElement("div");nd.className="radial-node";
    nd.innerHTML='<div class="icon">'+sec.icon+'</div><div class="label">'+sec.title+'</div>';
    nd.style.transform='translate('+(-s/2)+'px,'+(-s/2)+'px) translate('+fx+'px,'+fy+'px)';
    nd.style.animation='fadeNode 0.5s ease '+(i*0.05)+'s forwards';
    nd.onclick=function(){openContent(i)};wrap.appendChild(nd);
  });
}

function openContent(i){const s=SECTIONS[i];document.getElementById("contentTitle").textContent=s.icon+"  "+s.title;document.getElementById("contentBody").innerHTML=s.content;document.getElementById("contentPanel").style.display="block";document.getElementById("contentPanel").scrollTop=0}
function closeContent(){document.getElementById("contentPanel").style.display="none"}

function openSearch(){document.getElementById("searchOverlay").classList.add("show");document.getElementById("searchInput").value="";doSearch();setTimeout(function(){document.getElementById("searchInput").focus()},100)}
function closeSearch(e){if(e&&e.target!==e.currentTarget)return;document.getElementById("searchOverlay").classList.remove("show")}
function doSearch(){
  const q=document.getElementById("searchInput").value.trim().toLowerCase();
  const c=document.getElementById("searchResults");
  if(!q){c.innerHTML='<div class="search-empty">输入关键词搜索</div>';return}
  const results=[];
  for(let i=0;i<SECTIONS.length;i++){const s=SECTIONS[i];if((s.title+s.content.replace(/<[^>]+>/g,"")).toLowerCase().indexOf(q)>=0)results.push({idx:i,section:s})}
  if(results.length===0){c.innerHTML='<div class="search-empty">没有找到相关内容，换个关键词试试</div>';return}
  c.innerHTML=results.map(function(r){return '<div class="item" onclick="openContent('+r.idx+');closeSearch()"><div class="ico">'+r.section.icon+'</div><div class="info"><div class="t">'+r.section.title+'</div><div class="d">'+r.section.content.replace(/<[^>]+>/g,"").substring(0,60)+'...</div></div></div>'}).join("");
}

window.addEventListener("resize",function(){if(document.getElementById("mainScreen").style.display==="block"){radialDone=false;document.getElementById("radialContainer").innerHTML="";initRadial()}});

(function(){const cv=document.createElement("canvas");cv.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4";document.getElementById("mainScreen").prepend(cv);const ctx=cv.getContext("2d");let w=cv.width=window.innerWidth,h=cv.height=window.innerHeight;const pts=[];for(let i=0;i<35;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*2+1});function draw(){ctx.clearRect(0,0,w,h);pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(0,64,152,"+(.06+Math.random()*.08)+")";ctx.fill()});requestAnimationFrame(draw)}draw();window.addEventListener("resize",function(){w=cv.width=window.innerWidth;h=cv.height=window.innerHeight})})();
